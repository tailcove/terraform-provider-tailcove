name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1

  # The AWS module (modules/aws): formatted, valid for the real AWS provider, and its S3 forwarder's own tests.
  aws-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Formatting
        run: terraform fmt -check -recursive modules examples
      - name: Validate the module
        working-directory: modules/aws
        run: |
          terraform init -backend=false -input=false
          terraform validate
      # The provider is not in the Registry yet, so the example is validated against a build of this repository, through a dev override.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate the example
        run: |
          mkdir -p "$RUNNER_TEMP/provider"
          go build -o "$RUNNER_TEMP/provider/terraform-provider-tailcove" .
          cat > "$RUNNER_TEMP/terraformrc" <<EOF
          provider_installation {
            dev_overrides { "tailcove/tailcove" = "$RUNNER_TEMP/provider" }
            direct {}
          }
          EOF
          export TF_CLI_CONFIG_FILE="$RUNNER_TEMP/terraformrc"
          cd examples/aws
          terraform init -backend=false -input=false
          terraform validate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The S3 forwarder
        working-directory: modules/aws/lambda
        run: python -m unittest test_forwarder -v
