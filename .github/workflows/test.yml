name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1

  # The AWS module (modules/aws): formatted, valid for the real AWS provider, and its S3 forwarder's own tests.
  aws-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Formatting
        run: terraform fmt -check -recursive modules examples
      - name: Validate the module
        working-directory: modules/aws
        run: |
          terraform init -backend=false -input=false
          terraform validate
      # The provider is not in the Registry yet, so the example is validated against a build of this repository, served from a local mirror
      # (a dev override still makes `terraform init` ask the Registry for it).
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate the example
        run: |
          mirror="$RUNNER_TEMP/mirror/registry.terraform.io/tailcove/tailcove/0.0.1/linux_amd64"
          mkdir -p "$mirror"
          go build -o "$mirror/terraform-provider-tailcove_v0.0.1" .
          cat > "$RUNNER_TEMP/terraformrc" <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "$RUNNER_TEMP/mirror"
              include = ["tailcove/tailcove"]
            }
            direct {
              exclude = ["tailcove/tailcove"]
            }
          }
          EOF
          export TF_CLI_CONFIG_FILE="$RUNNER_TEMP/terraformrc"
          cd examples/aws
          terraform init -backend=false -input=false
          terraform validate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The S3 forwarder
        working-directory: modules/aws/lambda
        run: python -m unittest test_forwarder -v
