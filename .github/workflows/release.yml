name: release

# A pushed v* tag builds the provider for every platform with GoReleaser and attaches the archives and
# the SHA256SUMS to a GitHub release (a tag with a prerelease part, v0.1.0-rc.0, is a pre-release).
# No stored secret: the release uses the workflow's own token.
#
# Publishing to the Terraform Registry also needs the checksums signed with a GPG key; see README, "Releasing".

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - run: go test ./... -count=1

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
